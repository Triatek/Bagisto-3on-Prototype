services:
  # Bagisto PHP-FPM
  bagistostore:
    build:
      context: .
      dockerfile: Dockerfile
    image: bagistostore/php:2.3.8
    container_name: bagistostore
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/99-local.ini:ro
    expose:
      - "9000"
    networks:
      - app-network

  # Nginx for Bagisto HTTP requests
  webserverbagistostore:
    image: nginx:alpine
    container_name: webserverbagistostore
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./:/var/www:ro
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
    depends_on:
      - bagistostore
    networks:
      - app-network

networks:
  app-network:
    # external: true
    driver: bridge